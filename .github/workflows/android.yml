# Genera el Android App Bundle firmado para Google Play (red-publica-movil, design, decisión 11).
# Se lanza a mano o al subir una etiqueta v* (por ejemplo v1.0.0). La subida a Play Console se
# hace a mano con el AAB que queda como artefacto. Ver docs/publicar-android.md.
name: App Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # Cliente compilado contra el servidor público y copiado al proyecto Android.
      - run: node packages/movil/scripts/construir.mjs
        env:
          VITE_SERVIDOR_RED: ${{ vars.SERVIDOR_RED }}

      # La clave de subida llega en base64 desde los secrets y solo existe durante el job.
      - name: Clave de subida
        env:
          CLAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CLAVE" ]; then
            echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64 (ver docs/publicar-android.md)"
            exit 1
          fi
          echo "$CLAVE" | base64 -d > "$RUNNER_TEMP/subida.jks"

      - name: AAB firmado
        working-directory: packages/movil/android
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/subida.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: juegos-de-mesa-${{ github.run_number }}
          path: packages/movil/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
